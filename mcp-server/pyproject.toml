[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookkeeping-mcp"
version = "0.1.0"
description = "Deterministic calculation, jurisdiction constants and sandboxed Python for the bookkeeping-skills pack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hamishfromatech" }]
keywords = ["mcp", "bookkeeping", "accounting", "fastmcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastmcp>=2.1",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bookkeeping-mcp = "bookkeeping_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeping_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
